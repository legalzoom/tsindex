name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish macOS binaries
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install pinned Rust toolchain and targets
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; use a new version." >&2
            exit 1
          fi
      - name: Run tests
        run: cargo test --locked
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Stage assets and verify the native binary
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/tsindex dist/tsindex-macos-arm64
          cp target/x86_64-apple-darwin/release/tsindex dist/tsindex-macos-x86_64
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          case "$(uname -m)" in
            arm64) binary=dist/tsindex-macos-arm64 ;;
            x86_64) binary=dist/tsindex-macos-x86_64 ;;
            *) exit 1 ;;
          esac
          built_version="$($binary --version | awk '{print $2}')"
          test "${GITHUB_REF_NAME}" = "v${built_version}"
          cd dist
          shasum -a 256 tsindex-macos-arm64 tsindex-macos-x86_64 LICENSE THIRD_PARTY_NOTICES.md > checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "tsindex ${GITHUB_REF_NAME}" \
            --notes "macOS binaries with checksums, build provenance, and license notices." \
            dist/*
