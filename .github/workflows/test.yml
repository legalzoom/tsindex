name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Prepare sandbox and user service validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test_uid="$(id -u)"
          sudo systemctl start "user@${test_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${test_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${test_uid}/bus" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          TSINDEX_REQUIRE_SANDBOX: "1"
          TSINDEX_REQUIRE_SYSTEMD: "1"
        run: cargo test --locked
      - name: Exercise installed daemon through the CLI
        env:
          TSINDEX_TEST_INSTALL: "1"
        run: cargo test --locked --test service_activation installed_cli_controls_native_service -- --ignored --exact
      # Fetch the immutable writer independently: squash/rebase merges and
      # branch deletion can remove it from the main checkout's fetched history.
      - name: Checkout original overlay writer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 840d7d8fd7c6fede2e04b68b5376e583e6fd5f5c
          path: .worktrees/legacy-pr15
          persist-credentials: false
      - name: Build original overlay writer
        working-directory: .worktrees/legacy-pr15
        run: cargo build --locked
      - name: Test legacy writer compatibility
        env:
          TSINDEX_LEGACY_WRITER_BIN: ${{ github.workspace }}/.worktrees/legacy-pr15/target/debug/tsindex
        run: cargo test --locked --test overlays a_pr15_writer_can_publish_changes_for_a_directory_enabled_reader -- --ignored
      - name: Test skill startup
        run: bash skills/tsindex/scripts/test-start-tsindex.sh

  checks:
    name: fmt, clippy, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --deny warnings

  macos-clippy:
    name: macOS clippy and lifecycle
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Clippy
        id: native_clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test daemon and activation lifecycle
        run: |
          cargo test --locked --lib daemon::
          cargo test --locked --lib lifecycle::
          cargo test --locked --no-fail-fast --test cli --test daemon --test lifecycle --test service_activation
      - name: Exercise installed daemon through the CLI
        # The clean-runner install has its own service name and preflight.
        # Report its result even if an isolated daemon fixture failed.
        if: ${{ !cancelled() && steps.native_clippy.outcome == 'success' }}
        env:
          TSINDEX_TEST_INSTALL: "1"
        run: cargo test --locked --test service_activation installed_cli_controls_native_service -- --ignored --exact

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan Git history
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" .'
