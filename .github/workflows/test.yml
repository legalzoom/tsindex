name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Run tests
        run: cargo test --locked
      # Fetch the immutable writer independently: squash/rebase merges and
      # branch deletion can remove it from the main checkout's fetched history.
      - name: Checkout original overlay writer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 840d7d8fd7c6fede2e04b68b5376e583e6fd5f5c
          path: .worktrees/legacy-pr15
          persist-credentials: false
      - name: Build original overlay writer
        working-directory: .worktrees/legacy-pr15
        run: cargo build --locked
      - name: Test legacy writer compatibility
        env:
          TSINDEX_LEGACY_WRITER_BIN: ${{ github.workspace }}/.worktrees/legacy-pr15/target/debug/tsindex
        run: cargo test --locked --test overlays a_pr15_writer_can_publish_changes_for_a_directory_enabled_reader -- --ignored
      - name: Test skill startup
        run: bash skills/tsindex/scripts/test-start-tsindex.sh

  checks:
    name: fmt, clippy, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --deny warnings

  macos-clippy:
    name: macOS clippy
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan Git history
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" .'
